# Varsity player stats: read every team's roster (real positions and class years), then every played game's MaxPreps box score (games come from data/sections/*.json, so run "Collect section data" first),
# add the players up per section and sport, commit data/players/ and rebuild api/v1/. Resumable: games already counted are skipped, so a run
# cut short by max_minutes (or a failure) keeps its progress and the next run carries on. Football first; basketball has ~6x the games.
name: Collect section players
on:
  # a push that changes .github/triggers/players starts a football run (same as pressing Run workflow with the defaults);
  # a push that changes .github/triggers/players-bb starts a basketball run (rosters for every team, then box scores)
  push:
    branches: [main]
    paths: ['.github/triggers/players', '.github/triggers/players-bb']
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport'
        type: choice
        options: [fb, bb]
        default: fb
      max_minutes:
        description: 'Stop reading box scores after this many minutes (progress is saved)'
        default: '300'
      delay:
        description: 'Seconds between requests'
        default: '0.5'
      max_games:
        description: 'Most box scores this run (0 = no limit; use a small number for a test)'
        default: '0'
concurrency:
  group: varsity-collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest main, not the commit that started the run (a queued run used to build on old data and could not push)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the schools-and-games collector's page cache: rosters.py finds each team's address in it for data collected before v493
      - uses: actions/cache/restore@v4
        with:
          path: .mpcache
          key: mpcache-players-${{ github.run_id }}
          restore-keys: mpcache-
      - name: Offline tests
        run: |
          python3 -I tools/sections/test_maxpreps.py
          python3 -I tools/sections/test_players.py
          python3 -I tools/sections/test_rosters.py
      - name: Read rosters, then box scores in 20-minute rounds, publishing after each round
        env:
          VARSITY_CONTACT: https://github.com/varsityfantasy/varsityfantasy.github.io
          SPORT_IN: ${{ inputs.sport }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          DELAY: ${{ inputs.delay || '0.5' }}
          MAX_GAMES: ${{ inputs.max_games || '0' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '300' }}
        run: |
          # sport: the Run workflow choice, else basketball when the push changed .github/triggers/players-bb, else football
          SPORT="${SPORT_IN:-fb}"
          if [ "$EVENT" = "push" ] && gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null | grep -q 'triggers/players-bb'; then SPORT=bb; fi
          echo "sport: $SPORT"
          git config user.name "varsity-collector"
          git config user.email "actions@users.noreply.github.com"
          : > status.txt
          # publish: put this run's data on top of whatever main is NOW, rebuild the API from it, commit and push. Only this workflow writes
          # data/players, data/rosters and api player files, so nothing of anyone else's is ever overwritten and there is no merge to conflict.
          publish() {
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            cp -r data/players /tmp/keep/players
            [ -d data/rosters ] && cp -r data/rosters /tmp/keep/rosters
            git fetch -q origin main && git reset -q --hard origin/main || { echo "publish: could not fetch main"; return 1; }
            rm -rf data/players data/rosters
            cp -r /tmp/keep/players data/players
            [ -d /tmp/keep/rosters ] && cp -r /tmp/keep/rosters data/rosters
            python3 -I tools/sections/build_api.py > /dev/null || echo "build_api failed" >> status.txt
            { date -u +"%Y-%m-%dT%H:%M:%SZ run ${GITHUB_RUN_ID}"; cat status.txt; } > data/players/last_run.txt
            git add -A data/players data/rosters api
            git diff --cached --quiet && return 0
            git commit -q -m "$1" && git push -q origin HEAD:main || { echo "publish: push failed"; return 1; }
          }
          START=$(date +%s)
          # rosters for both sports (basketball falls back to last season's roster, seniors out, for a team that has not posted 2026-27 yet)
          python3 -I tools/sections/rosters.py --sport "$SPORT" --cache .mpcache --delay "$DELAY" --max-minutes 40 | tee roster.log || true
          grep -E "^rosters|^  first empty|^  [0-9]+ teams from|STOPPED" roster.log >> status.txt || true
          publish "Rosters update ($SPORT)" || true
          for round in $(seq 1 30); do
            python3 -I tools/sections/players.py --sport "$SPORT" --delay "$DELAY" --max-minutes 20 --max-games "$MAX_GAMES" | tee round.log || true
            { echo "round $round:"; grep -E "^(fb|bb):|^done:|STOPPED|Traceback|Error" round.log; } >> status.txt || true
            publish "Player stats update ($SPORT, round $round)" || publish "Player stats update ($SPORT, round $round)" || true
            grep -q " 0 to fetch" round.log && break
            grep -q "STOPPED" round.log && break
            [ "$MAX_GAMES" != "0" ] && break
            [ $(( $(date +%s) - START )) -gt $(( MAX_MINUTES * 60 )) ] && break
          done
          echo "---- status"; cat status.txt
