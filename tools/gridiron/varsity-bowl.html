/* scale four raw numbers so they sum to tot with every one inside 40..99 */
function fit(raw,tot){let v=raw.slice(),fx=v.map(()=>false);
 for(let it=0;it<8;it++){const free=v.map((x,i)=>i).filter(i=>!fx[i]);if(!free.length)break;

 for(let i=0;d&&i<60;i++){const j=i%v.length;if(d>0&&v[j]<AMAX){v[j]++;d--}else if(d<0&&v[j]>AMIN){v[j]--;d++}}

/* ---------- main loop ---------- */
let last=performance.now();
function update(dt){
  if(G&&!paused){
   stepPT(dt);if(G.shk>0)G.shk=Math.max(0,G.shk-dt);
   if(G.phase==='play'&&G.pl&&!G.pl.done&&!G.ot&&!G.prac&&!G.over&&!G.vs){const S=G.pl;if(!S.ko&&(S.t>=S.snapT||S.pick)&&G.clock>0){const d=Math.min(dt,G.clock);G.clock-=d;G.live=(G.live||0)+d}}
   if(P&&P.all)P.all.forEach(p=>{if(flyStep(p,dt))return;if(p.jmpT>0){p.jmpT-=dt;const u=1-p.jmpT/p.jmp0;p.air=Math.max(0,Math.sin(Math.min(1,u)*Math.PI))*11;p.pose='up';if(p.jmpT<=0){p.jmpT=0;p.air=0;p.pose=null}return}if(p.poseT>0){p.poseT-=dt;if(p.pose==='blk')p.air=Math.max(0,Math.sin((1-p.poseT/p.poseT0)*Math.PI))*(p.pose==='blk'?9:7);if(p.poseT<=0){p.pose=null;p.air=0}}});
   if(G.phase==='play'&&G.pl)stepPlay(dt);
   else if(G.phase==='presnap'&&P){P.all.forEach(p=>{p.vx=0;p.vy=0})}
   else if(G.phase==='result'){G.rt+=dt;if(G.pl)stepAnim(dt);if(G.pl&&G.pl.res)stepDef2(dt)}
   else if(G.phase==='opp')G.camOpp+=dt;
   else if(G.phase==='kick'&&G.kick)G.kick.t+=dt*(G.kick.sl||1);
   else if(G.phase==='meter'){const M=G.meter;if(!M.done){if(M.st===0){M.pw+=M.pd*M.psp*dt;if(M.pw>=1){M.pw=1;M.pd=-1}if(M.pw<=0){M.pw=0;M.pd=1}}else{M.a+=M.ad*M.asp*dt;if(M.a>=M.a0+.42){M.a=M.a0+.42;M.ad=-1}if(M.a<=M.a0-.42){M.a=M.a0-.42;M.ad=1}}}}}}
