function drawStr(s,x,y,c,sc){g.fillStyle=c;for(let i=0;i<s.length;i++){const gl=FONT[s[i]];if(!gl)continue;for(let r=0;r<7;r++){const row=gl[r];if(!row)continue;for(let k=0;k<5;k++)if(row&(16>>k))g.fillRect(x+(i*6+k)*sc,y+r*sc,sc,sc)}}}
function tw(s,sc){return String(s).length*6*(sc||1)-(sc||1)}
function txt(s,x,y,c,sc,al,ns){s=String(s).toUpperCase();sc=sc||1;const w=tw(s,sc);if(al==='c')x-=w/2;else if(al==='r')x-=w;x=Math.round(x);y=Math.round(y);if(!ns)drawStr(s,x+sc,y+sc,'#000',sc);drawStr(s,x,y,c,sc);return w}
/* text turned on its side (end zones): dir -1 reads bottom to top, +1 top to bottom */
function txtR(s,x,y,c,sc,dir){s=String(s).toUpperCase();g.fillStyle=c;for(let i=0;i<s.length;i++){const gl=FONT[s[i]];if(!gl)continue;for(let r=0;r<7;r++){const row=gl[r];if(!row)continue;for(let k=0;k<5;k++)if(row&(16>>k)){const a=(i*6+k)*sc;if(dir<0)g.fillRect(Math.round(x+r*sc),Math.round(y-a-sc),sc,sc);else g.fillRect(Math.round(x+(6-r)*sc),Math.round(y+a),sc,sc)}}}}

function sh(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,gg=n>>8&255,b=n&255;if(f>=0){r+=(255-r)*f;gg+=(255-gg)*f;b+=(255-b)*f}else{r*=1+f;gg*=1+f;b*=1+f}return'#'+[r,gg,b].map(v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2)).join('')}
const lum=hex=>{const n=parseInt(hex.slice(1),16);return((n>>16)*.3+(n>>8&255)*.59+(n&255)*.11)};
function line(x0,y0,x1,y1,c,w){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let er=dx+dy;g.fillStyle=c;for(let n=0;n<2000;n++){g.fillRect(x0,y0,w,w);if(x0===x1&&y0===y1)break;const e2=2*er;if(e2>=dy){er+=dy;x0+=sx}if(e2<=dx){er+=dx;y0+=sy}}}
function arrow(x0,y0,x1,y1,c,w){line(x0,y0,x1,y1,c,w);const a=Math.atan2(y1-y0,x1-x0);for(const s of[-2.5,2.5])line(x1,y1,x1-Math.cos(a+s*.4)*6,y1-Math.sin(a+s*.4)*6,c,w)}

function ssNew(){const nm=CFG.opps.slice().sort(()=>Math.random()-.5);let pool=nm;while(pool.length<11)pool=pool.concat(nm.length?nm:[{n:'RIVALS',c1:'#c8102e',c2:'#ffffff'}]);SS={res:[],opps:pool.slice(0,11),lvl:CFG.lvl,ql:CFG.ql,done:false,champ:false,msg:''};ssSave()}
const ssIdx=()=>SS.res.length,ssLab=i=>i<8?'WEEK '+(i+1):PO[i-8];
const ssWins=()=>SS.res.slice(0,8).filter(r=>r.me>r.op).length;
function ssPlay(){const i=ssIdx();CFG.lvl=SS.lvl;CFG.ql=SS.ql;SCR='game';resetGame({opp:SS.opps[i],bump:i*1.8,ssn:true})}
function ssAfter(r){SS.res.push(r);const i=SS.res.length;
 if(i===8){if(ssWins()<5){SS.done=true;SS.msg='MISSED THE PLAYOFFS · '+ssWins()+'-'+(8-ssWins())}else SS.msg='PLAYOFFS! YOU WENT '+ssWins()+'-'+(8-ssWins())}
 else if(i>8){if(r.me<=r.op){SS.done=true;SS.msg='KNOCKED OUT IN THE '+PO[i-9]}else if(i===11){SS.done=true;SS.champ=true;SS.msg='CHAMPIONS!'}}
 ssSave()}
function teamCols(){const me=CFG.team,op=G.opp;let c1=me.c1,c2=me.c2,d1=op.c1,d2=op.c2;if(Math.abs(lum(c1)-lum(d1))<55){d1=lum(d2)>140&&Math.abs(lum(c1)-lum(d2))>55?d2:'#f4f4f4';if(Math.abs(lum(c1)-lum(d1))<55)d1='#1a1a1a'}
 TEAMS[0]={e:me.c1,j:c1,p:lum(c2)>130?c2:'#e8e8e8',h:sh(c1,-.15),a:c2,n:me.n};TEAMS[1]={e:op.c1,j:d1,p:lum(d2)>130?d2:'#e8e8e8',h:sh(d1,-.15),a:d2,n:op.n}}

 const op=o.opp||(CFG.opps.length?pick(CFG.opps):{n:'RIVALS',c1:'#c8102e',c2:'#ffffff'});
 G={q:1,clock:CFG.ql,score:[0,0],los:EZ+25*YD,fd:0,down:1,phase:'select',opp:op,oppO:Math.min(99,LVL[CFG.lvl].o+(o.bump||0)),ssn:!!o.ssn,prac:!!o.prac,ot:0,over:false,msg:null,rt:0,next:null,st:{py:0,ry:0,td:0,pl:0,cmp:0,att:0,it:0,sk:0},hint:true,hintN:0,sel:-1};
 teamCols();setFD();toSelect()}

 g.fillStyle='#000';g.fillRect(0,0,W,H);
 /* stands */
 for(let y=14;y<30;y+=2){for(let x=-(Math.floor(camX)%6)-6;x<W;x+=3){const wx=Math.floor((x+camX)/3),h=((wx*73856093)^(y*19349663))>>>0,v=h%11;const c=v<2?'#c9423c':v<4?'#3d6ad8':v<6?'#e8d9a0':v<8?'#2b3345':'#444b5e';rect(x,y,3,2,c)}}
 rect(0,30,W,FT-30,'#1f6a2a');rect(0,30,W,2,'#2b2f3d');
 /* sidelines figures */
 for(let i=0;i<30;i++){const wx=i*52+13;if(wx-camX<-8||wx-camX>W+8)continue;const x=wx-camX,y=33+((i*7)%4);rect(x,y,3,5,i%3?'#e8e8e8':TEAMS[i%2].j);rect(x,y-2,3,2,'#c68642')}

 /* yard lines */

  if(y%5===0){for(let k=0;k<5;k++){const hx=sx+k*YD/5*2;}}}
 for(let y=1;y<100;y++){if(y%5===0)continue;const sx=Math.round(EZ+y*YD-camX);if(sx<0||sx>W)continue;rect(sx,FT+50,1,3,'#b9d4b0');rect(sx,FT+FH-53,1,3,'#b9d4b0');rect(sx,FT+2,1,3,'#b9d4b0');rect(sx,FT+FH-5,1,3,'#b9d4b0')}
 for(let y=10;y<=90;y+=10){const sx=EZ+y*YD-camX,n=y<=50?y:100-y;if(sx<-30||sx>W+30)continue;const s=String(n);const w=tw(s,2);for(let i=0;i<s.length;i++){drawFlip(s[s.length-1-i],sx-w/2+i*12,FT+8,'#e6efd6',2,1);drawStr(s[i],Math.round(sx-w/2+i*12),FT+FH-22,'#e6efd6',2)}}
 /* mid logo */
 {const sx=EZ+50*YD-camX;if(sx>-30&&sx<W+30){g.fillStyle='#1b6e22';g.beginPath();g.arc(Math.round(sx),FT+CY,18,0,7);g.fill();txt('V',sx,FT+CY-8,'#f4d35e',2,'c',true)}}
 /* end zone text */
 {const a=0-camX;if(a>-130&&a<W){txtR(TEAMS[0].n.slice(0,9),a+EZ/2-8,FT+FH/2+tw(TEAMS[0].n.slice(0,9),3)/2,ezc(0),3,-1)}
  const b=GOAL-camX;if(b>-130&&b<W){const nn=TEAMS[1].n.slice(0,9);txtR(nn,b+EZ/2-14,FT+FH/2-tw(nn,3)/2,ezc(1),3,1)}}

 rect(0,FT+FH+3,W,H-FT-FH-3,'#1f6a2a');
 for(let wx=Math.floor(camX/24)*24;wx<camX+W+24;wx+=24)rect(wx-camX,FT+FH+10,12,1,'#cfd8bd');

 for(let i=0;i<26;i++){const wx=i*61+30;if(wx-camX<-8||wx-camX>W+8)continue;const x=wx-camX,y=FT+FH+14+((i*5)%6);rect(x,y,3,5,i%2?TEAMS[0].j:TEAMS[1].j);rect(x,y-2,3,2,'#8d5524')}

  if(d&&!d.z){hx=d.x;hy=d.y;C.auto=false}
  else if(C.rt&&C.ri<C.rt.length&&!C.manual&&!(d&&!d.z)){const w=C.rt[C.ri];if(moveTo(C,w.x,w.y,sp,dt)<4)C.ri++;C.vx=C.vx;return afterMove(C)}

/* a receiver runs his route at one steady speed, then keeps going the way he was headed until the ball is thrown */

 while(left>0&&r.ri<r.rt.length){const w=r.rt[r.ri],dx=w.x-r.x,dy=w.y-r.y,l=Math.hypot(dx,dy);moved=true;

 if(left>0&&r.ext){r.x=Math.min(FL-8,r.x+r.dx*left);r.y=clamp(r.y+r.dy*left,5,FH-5);moved=true}
 if(moved){r.vx=r.dx*r.spd;r.vy=r.dy*r.spd;r.ph+=r.spd*dt/3;if(Math.abs(r.dx)>.2)r.f=r.dx>0?1:-1}else{r.vx=0;r.vy=0}}
function stepPlay(dt){
 const S=G.pl;if(!S||S.done&&!S.ball)return;
 if(S.done){S.end-=dt;stepAnim(dt);return}
 S.t+=dt;const t=S.t,Q=P.qb,sn=t>=S.snapT,pass=S.pl.k==='pass'||S.pl.draw;

let last=performance.now();
function update(dt){
  if(G&&!paused){
   if(G.phase==='play'&&G.pl)stepPlay(dt);
   else if(G.phase==='presnap'&&P){P.all.forEach(p=>{p.vx=0;p.vy=0})}
   else if(G.phase==='result'){G.rt+=dt;if(G.pl)stepAnim(dt);if(G.pl&&G.pl.res)stepDef2(dt)}
   else if(G.phase==='opp')G.camOpp+=dt;
   else if(G.phase==='kick'&&G.kick)G.kick.t+=dt;
   else if(G.phase==='meter'){const M=G.meter;if(!M.done){M.m+=M.dir*M.sp*dt;if(M.m>=1){M.m=1;M.dir=-1}if(M.m<=0){M.m=0;M.dir=1}}}}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tNow=now/1000;

 requestAnimationFrame(frame)}
